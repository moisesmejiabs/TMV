    <h1 class="nav-gold"><span id="event-form-title" data-en="Create Event" data-es="Crear Evento"></span></h1>

 <form id="eventForm" class="form">
  <label>Event Name
    <input name="name" required>
  </label>

  <label>Date & Time
    <input type="datetime-local" name="date" required>
  </label>

  <label>Presenter
    <input name="presenter" required>
  </label>

  <label>Location
    <input name="location" required>
  </label>

  <label>Capacity
    <input type="number" name="capacity" min="0">
  </label>

  <label>About
    <textarea name="about" rows="6" required></textarea>
  </label>

  <label>Requirements
    <textarea name="requirements" rows="4"></textarea>
  </label>

  <label>Event Image
    <input type="file" name="image" accept="image/*">
  </label>

  <button type="submit">Create Event</button>
</form>

<script>
console.log("🚀 eventForm script loaded");

const formEl = document.getElementById("eventForm");
const editEventId = new URLSearchParams(window.location.search).get("id");
console.log("🔍 event form element:", formEl);

function toDatetimeLocal(value) {
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  const offsetMs = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - offsetMs).toISOString().slice(0, 16);
}

function localInputToIso(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? value : d.toISOString();
}

async function loadEventForEdit() {
  if (!editEventId || !formEl) return;
  const res = await fetch(`/api/events/${encodeURIComponent(editEventId)}`, { credentials: "include" });
  const event = await res.json().catch(() => null);
  if (!res.ok) throw new Error((event && event.error) || "Failed to load event");
  document.getElementById("event-form-title").textContent = "Edit Event";
  const submit = formEl.querySelector('button[type="submit"]');
  if (submit) submit.textContent = "Save Event";
  formEl.elements.name.value = event.name || "";
  formEl.elements.date.value = toDatetimeLocal(event.date);
  formEl.elements.presenter.value = event.presenter || "";
  formEl.elements.location.value = event.location || "";
  formEl.elements.capacity.value = event.capacity || 0;
  formEl.elements.about.value = event.about || "";
  formEl.elements.requirements.value = event.requirements || "";
}

loadEventForEdit().catch((err) => {
  console.error("Failed to load event for edit:", err);
  alert(err.message || "Failed to load event.");
});

if (!formEl) {
  console.error("❌ eventForm NOT FOUND");
} else {
  formEl.addEventListener("submit", async (e) => {
    console.log("🖱️ EVENT SUBMIT triggered");
    e.preventDefault();

    try {
      const form = e.target;

      let imageUrl = "";
      const imageFile = form.image?.files?.[0];
      if (imageFile) {
        const imageForm = new FormData();
        imageForm.append("image", imageFile);

        const uploadRes = await fetch("/api/upload-image", {
          method: "POST",
          credentials: "include",
          body: imageForm
        });
        const uploadData = await uploadRes.json().catch(() => null);
        if (!uploadRes.ok) {
          throw new Error((uploadData && uploadData.error) || "Image upload failed");
        }
        imageUrl = uploadData.url || "";
      }

      const payload = {
        name: form.elements.name.value.trim(),
        date: localInputToIso(form.elements.date.value),
        presenter: form.elements.presenter.value.trim(),
        location: form.elements.location.value.trim(),
        capacity: Number(form.elements.capacity.value || 0),
        about: form.elements.about.value.trim(),
        requirements: form.elements.requirements.value.trim(),
        image_url: imageUrl
      };

      console.log("📦 Event payload:", payload);

      const res = await fetch(editEventId ? `/api/events/${encodeURIComponent(editEventId)}` : "/api/events", {
        method: editEventId ? "PATCH" : "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(payload)
      });

      console.log("📡 event response status:", res.status);

      const rawText = await res.text();
      console.log("📄 raw response text:", rawText);

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (jsonErr) {
        console.error("❌ Failed to parse event JSON response", jsonErr);
        return;
      }

      console.log("✅ parsed event response:", data);

      if (!res.ok) {
        console.error("❌ Event create failed:", data);
        alert("Failed to create event.");
        return;
      }

      console.log("🎉 Event saved successfully, ID:", data.id || editEventId);
      window.location.href = `/event.html?id=${encodeURIComponent(data.id || editEventId)}`;

    } catch (err) {
      console.error("💥 EVENT SUBMIT ERROR:", err);
      alert("Unexpected error creating event.");
    }
  });
}
</script>
