    <h1 class="nav-gold"><span data-en="Create Event" data-es="Crear Evento"></span></h1>

 <form id="eventForm" class="form">
  <label>Event Name
    <input name="name" required>
  </label>

  <label>Date & Time
    <input type="datetime-local" name="date" required>
  </label>

  <label>Presenter
    <input name="presenter" required>
  </label>

  <label>Location
    <input name="location" required>
  </label>

  <label>Capacity
    <input type="number" name="capacity" min="0">
  </label>

  <label>About
    <textarea name="about" rows="6" required></textarea>
  </label>

  <label>Requirements
    <textarea name="requirements" rows="4"></textarea>
  </label>

  <button type="submit">Create Event</button>
</form>

<script>
console.log("🚀 eventForm script loaded");

const formEl = document.getElementById("eventForm");
console.log("🔍 event form element:", formEl);

if (!formEl) {
  console.error("❌ eventForm NOT FOUND");
} else {
  formEl.addEventListener("submit", async (e) => {
    console.log("🖱️ EVENT SUBMIT triggered");
    e.preventDefault();

    try {
      const form = e.target;

      const payload = {
        name: form.name.value.trim(),
        date: form.date.value,
        presenter: form.presenter.value.trim(),
        location: form.location.value.trim(),
        capacity: Number(form.capacity.value || 0),
        about: form.about.value.trim(),
        requirements: form.requirements.value.trim()
      };

      console.log("📦 Event payload:", payload);

      const res = await fetch("/api/events", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(payload)
      });

      console.log("📡 event response status:", res.status);

      const rawText = await res.text();
      console.log("📄 raw response text:", rawText);

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (jsonErr) {
        console.error("❌ Failed to parse event JSON response", jsonErr);
        return;
      }

      console.log("✅ parsed event response:", data);

      if (!res.ok) {
        console.error("❌ Event create failed:", data);
        alert("Failed to create event.");
        return;
      }

      console.log("🎉 Event created successfully, ID:", data.id);
      alert(`Event created successfully. ID: ${data.id}`);
      form.reset();

    } catch (err) {
      console.error("💥 EVENT SUBMIT ERROR:", err);
      alert("Unexpected error creating event.");
    }
  });
}
</script>
