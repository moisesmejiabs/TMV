    <h1 class="nav-gold"><span id="course-form-title" data-en="Create Course" data-es="Crear Curso"></span></h1>

 <form id="courseForm" class="form">
  <label>Course Name
    <input name="name" required>
  </label>

  <label>Date & Time
    <input type="datetime-local" name="date" required>
  </label>

  <label>Presenter
    <input name="presenter" required>
  </label>

  <label>Location
    <input name="location" required>
  </label>

  <label>Capacity
    <input type="number" name="capacity" min="0">
  </label>

  <label>About
    <textarea name="about" rows="6" required></textarea>
  </label>

  <label>Requirements
    <textarea name="requirements" rows="4"></textarea>
  </label>

  <label>Course Image
    <input type="file" name="image" accept="image/*">
  </label>

  <button type="submit">Submit</button>
</form>

<script id="course-form-debug">
console.log("🚀 courseForm script loaded");

const formEl = document.getElementById("courseForm");
const editCourseId = new URLSearchParams(window.location.search).get("id");

function toDatetimeLocal(value) {
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  const offsetMs = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - offsetMs).toISOString().slice(0, 16);
}

function localInputToIso(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? value : d.toISOString();
}

async function loadCourseForEdit() {
  if (!editCourseId || !formEl) return;
  const res = await fetch(`/api/courses/${encodeURIComponent(editCourseId)}`, { credentials: "include" });
  const course = await res.json().catch(() => null);
  if (!res.ok) throw new Error((course && course.error) || "Failed to load course");
  document.getElementById("course-form-title").textContent = "Edit Course";
  const submit = formEl.querySelector('button[type="submit"]');
  if (submit) submit.textContent = "Save Course";
  formEl.elements.name.value = course.name || "";
  formEl.elements.date.value = toDatetimeLocal(course.date);
  formEl.elements.presenter.value = course.presenter || "";
  formEl.elements.location.value = course.location || "";
  formEl.elements.capacity.value = course.capacity || 0;
  formEl.elements.about.value = course.about || "";
  formEl.elements.requirements.value = course.requirements || "";
}

loadCourseForEdit().catch((err) => {
  console.error("Failed to load course for edit:", err);
  alert(err.message || "Failed to load course.");
});

console.log("🔍 form element:", formEl);

if (!formEl) {
  console.error("❌ courseForm NOT FOUND");
} else {
  formEl.addEventListener("submit", async (e) => {
    console.log("🖱️ SUBMIT event triggered");

    e.preventDefault();

    try {
      const form = e.target;

      console.log("📋 Raw form values:");
      console.log("   name:", form.elements.name?.value);
      console.log("   date:", form.elements.date?.value);
      console.log("   presenter:", form.elements.presenter?.value);
      console.log("   location:", form.elements.location?.value);
      console.log("   capacity:", form.elements.capacity?.value);
      console.log("   about:", form.elements.about?.value);
      console.log("   requirements:", form.elements.requirements?.value);

      let imageUrl = "";
      const imageFile = form.image?.files?.[0];
      if (imageFile) {
        const imageForm = new FormData();
        imageForm.append("image", imageFile);

        const uploadRes = await fetch("/api/upload-image", {
          method: "POST",
          credentials: "include",
          body: imageForm
        });
        const uploadData = await uploadRes.json().catch(() => null);
        if (!uploadRes.ok) {
          throw new Error((uploadData && uploadData.error) || "Image upload failed");
        }
        imageUrl = uploadData.url || "";
      }

      const payload = {
        name: form.elements.name.value.trim(),
        date: localInputToIso(form.elements.date.value),
        presenter: form.elements.presenter.value.trim(),
        location: form.elements.location.value.trim(),
        capacity: Number(form.elements.capacity.value || 0),
        about: form.elements.about.value.trim(),
        requirements: form.elements.requirements.value.trim(),
        image_url: imageUrl
      };

      console.log("📦 Payload to send:", payload);
      console.log("🌐 Sending course save request");

      const res = await fetch(editCourseId ? `/api/courses/${encodeURIComponent(editCourseId)}` : "/api/courses", {
        method: editCourseId ? "PATCH" : "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify(payload)
      });

      console.log("📡 Response received:");
      console.log("   status:", res.status);
      console.log("   ok:", res.ok);

      const rawText = await res.text();
      console.log("📄 Raw response text:", rawText);

      let data;
      try {
        data = JSON.parse(rawText);
      } catch (jsonErr) {
        console.error("❌ Failed to parse JSON response", jsonErr);
        return;
      }

      console.log("✅ Parsed response:", data);

      if (res.ok) {
        console.log("✅ Course saved successfully → redirecting");
        window.location.href = editCourseId ? `/course.html?id=${encodeURIComponent(editCourseId)}` : "/courses.html";
        return;
      }

      if (!res.ok) {
        console.error("❌ Server returned error:", data);
      } else {
        console.log("🎉 Course created successfully, ID:", data.id);
      }

    } catch (err) {
      console.error("💥 FETCH / SUBMIT ERROR:", err);
    }
  });
}
</script>
