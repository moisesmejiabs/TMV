      <div id="actions"></div>
      <div id="list"></div>

    </main>
    <script src="/static/js/app.js"></script>
    <script>
      async function api(path, opts={}){
        const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
        const j=await r.json().catch(()=>null);
        if(!r.ok) throw new Error(j?.error || 'Failed');
        return j;
      }
      (async()=>{
        const me = await api('/api/me').catch(()=>null);
        document.getElementById('actions').innerHTML = me ? '<p><a href="/thread_create.html">Create thread</a></p>' : '<p><a href="/login.html">Login</a> to create threads.</p>';
        const threads = await api('/api/forum/threads');
        document.getElementById('list').innerHTML = '<ul>' + threads.map(t=>`<li><a href="/thread.html?id=${t.id}">${t.title}</a> — ${new Date(t.created_at).toLocaleString()}</li>`).join('') + '</ul>';
      })();
    </script>
