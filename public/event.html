<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu Mejor Versión</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .event-page {
      padding-top: 24px;
      padding-bottom: 40px;
    }
    .event-detail-card {
      overflow: hidden;
      margin: 0 auto 24px;
      border: 1px solid rgba(91, 45, 109, 0.14);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(74, 35, 90, 0.1);
    }
    .event-image-wrap {
      width: 100%;
      background: #f8f3f8;
      text-align: center;
    }
    .event-image-wrap[hidden] { display: none; }
    .event-detail-image {
      display: block;
      width: 100%;
      max-height: 680px;
      object-fit: contain;
      margin: 0 auto;
    }
    .event-detail-content {
      padding: clamp(20px, 4vw, 36px);
    }
    .event-detail-content h1 {
      margin-top: 0;
      margin-bottom: 22px;
    }
    .event-facts {
      display: grid;
      gap: 14px;
      margin: 0 0 24px;
    }
    .event-fact {
      display: grid;
      grid-template-columns: minmax(120px, max-content) minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .event-fact dt { font-weight: 700; }
    .event-fact dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .feedback-section {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .feedback-list,
    .feedback-item,
    .feedback-text {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .feedback-section textarea,
    .edit-feedback-textarea {
      display: block;
      width: 100% !important;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      resize: vertical;
    }
    @media (max-width: 640px) {
      .event-page { padding-top: 14px; }
      .event-detail-card { border-radius: 16px; }
      .event-fact {
        grid-template-columns: 1fr;
        gap: 3px;
      }
    }
  </style>
</head>
<body>
    <header class="top">
    <div class="brand" style="text-align: center;">

      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">
      
      <h1 class="nav-gold">
        <span 
          data-en="Tu<br>Mejor<br>Version" 
          data-es="Tu<br>Mejor<br>Versión">
        </span>
      </h1> 
      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">

      <!-- Right side: Auth controls -->
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>

    </div>

    <div style="margin-bottom: 20px;">
      <!-- 🌐 Language toggle buttons -->
      <span class="lang-toggle">
        <button type="button" class="lang-btn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" onclick="setLanguage('es')">🇲🇽 ES</button>
      </span>
    </div>
    
    <div class="nav-container">
      <!-- Hamburger Button -->
      <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Overlay Menu -->
      <nav id="mobile-menu" class="mobile-menu">

        <a href="/" class="nav-btn">
          <span data-en="Home" data-es="Inicio"></span>
        </a>

        <a href="/courses" class="nav-btn">
          <span data-en="Courses" data-es="Cursos"></span>
        </a>

        <a href="/events" class="nav-btn">
          <span data-en="Events" data-es="Eventos"></span>
        </a>

        <a href="/donate" class="nav-btn">
          <span data-en="Donate" data-es="Donar"></span>
        </a>

        <a href="/media" class="nav-btn">
          <span data-en="Media" data-es="Medios"></span>
        </a>

        <a href="/forum" class="nav-btn">
          <span data-en="Forum" data-es="Foro"></span>
        </a>

        <a href="/about" class="nav-btn">
          <span data-en="About Us" data-es="Sobre Nosotros"></span>
        </a>

        <div id="auth-links" class="auth-links"></div>

      </nav>
    </div>
  </header>
  <main class="container event-page">
    <article class="event-detail-card">
      <div id="event-image-wrap" class="event-image-wrap" hidden>
        <img id="event-image" class="event-detail-image" alt="">
      </div>
      <div class="event-detail-content">
        <h1 id="title">Event</h1>
        <dl class="event-facts">
          <div class="event-fact"><dt>Date:</dt><dd id="date"></dd></div>
          <div class="event-fact"><dt>Presenter:</dt><dd id="presenter"></dd></div>
          <div class="event-fact"><dt>Description:</dt><dd id="about"></dd></div>
          <div class="event-fact"><dt>Location:</dt><dd id="loc"></dd></div>
          <div class="event-fact"><dt>Requirements:</dt><dd id="req"></dd></div>
          <div class="event-fact"><dt>Capacity:</dt><dd id="cap"></dd></div>
          <div class="event-fact"><dt>Registered:</dt><dd id="count"></dd></div>
        </dl>
        <div id="actions"></div>
        <div id="admin"></div>
        <p><a href="/events.html">Back</a></p>
      </div>
    </article>
    <section class="feedback-section card">
    <h2 data-en="Leave Feedback" data-es="Dejar Comentarios">Leave Feedback</h2>

    <form id="event-feedback-form" class="feedback-form">
      <label for="event-feedback-text" data-en="Your feedback" data-es="Tus comentarios">
        Your feedback
      </label>

      <div class="emoji-toolbar" id="emoji-toolbar">
        <button type="button" class="emoji-btn" data-emoji="😀">😀</button>
        <button type="button" class="emoji-btn" data-emoji="😊">😊</button>
        <button type="button" class="emoji-btn" data-emoji="🙏">🙏</button>
        <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
        <button type="button" class="emoji-btn" data-emoji="👏">👏</button>
        <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
        <button type="button" class="emoji-btn" data-emoji="🙌">🙌</button>
      </div>

      <textarea
        id="event-feedback-text"
        name="feedback"
        rows="5"
        maxlength="1000"
        placeholder="Write your feedback here..."
        data-en-placeholder="Write your feedback here..."
        data-es-placeholder="Escribe tus comentarios aquí..."
        required
      ></textarea>

      <div class="feedback-actions">
        <button type="submit" class="btn" data-en="Submit Feedback" data-es="Enviar Comentarios">
          Submit Feedback
        </button>
        <span id="event-feedback-status" class="muted"></span>
      </div>
    </form>

    <div class="feedback-list-wrap">
      <h3 data-en="Comments" data-es="Comentarios">Comments</h3>
      <ul id="event-feedback-list" class="feedback-list">
        <li class="muted" data-en="No feedback yet." data-es="Aún no hay comentarios.">No feedback yet.</li>
      </ul>
    </div>
    </section>
  </main>
  
  <script src="/static/js/app.js"></script>

  <script>
  function q(name){return new URLSearchParams(location.search).get(name)}
  async function api(path, opts={}){
    const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
    const ct=r.headers.get('content-type')||'';
    const b=ct.includes('application/json')?await r.json().catch(()=>null):await r.text().catch(()=>null);
    if(!r.ok) throw new Error((b&&b.error)||'Request failed');
    return b;
  }
  (async()=>{
    const id=q('id');
    const e=await api(`/api/events/${id}`);
    document.title = e.name;
    document.getElementById('title').textContent=e.name;
    document.getElementById('date').textContent = new Date(e.date).toLocaleString();
    document.getElementById('presenter').textContent = e.presenter || 'Not specified';
    document.getElementById('about').textContent = e.about;
    document.getElementById('loc').textContent = e.location;
    document.getElementById('req').textContent = e.requirements || 'None';
    document.getElementById('cap').textContent = e.capacity || 0;
    document.getElementById('count').textContent = e.enrolled_count;
    if(e.image_url){
      const imageWrap = document.getElementById('event-image-wrap');
      const image = document.getElementById('event-image');
      image.alt = `${e.name} event image`;
      image.addEventListener('error', () => {
        imageWrap.hidden = true;
      }, { once: true });
      image.src = e.image_url;
      imageWrap.hidden = false;
    }

    const me = await api('/api/me').catch(()=>null);
    let html='';
    if(!me){ html = '<p><a href="/login.html">Login</a> to register.</p>'; }
    else {
      html += e.enrolled ? '<button id="cancel">Cancel Registration</button>' : '<button id="enroll">Register</button>';
      if(me.role==='admin') html += ' <button id="delete">Delete Event</button>';
    }
    document.getElementById('actions').innerHTML = html;

    const enrollBtn=document.getElementById('enroll');
    if(enrollBtn) enrollBtn.addEventListener('click', async()=>{await api(`/api/events/${id}/enroll`,{method:'POST'}); location.reload();});
    const cancelBtn=document.getElementById('cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', async()=>{await api(`/api/events/${id}/cancel`,{method:'POST'}); location.reload();});
    const delBtn=document.getElementById('delete');
    if(delBtn) delBtn.addEventListener('click', async()=>{if(confirm('Delete this event?')){await api(`/api/events/${id}`,{method:'DELETE'}); location.href='/events.html';}});

    if(me && me.role==='admin'){
      const users = await api(`/api/events/${id}/registered`);
      document.getElementById('admin').innerHTML = '<h3>Registered Users</h3>' + (users.length?('<ul>'+users.map(u=>`<li>${u.name} (${u.email})</li>`).join('')+'</ul>'):'<p>No registrations.</p>');
    }
  })().catch(err=>{document.getElementById('about').textContent=err.message;});
  </script>
</body></html>
