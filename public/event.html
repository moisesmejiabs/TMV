<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu Mejor Versión</title>
  <link rel="stylesheet" href="/static/css/style.css?v=admin-action-header-20260725" />
  <style>
    .event-detail-media {
      width: min(100%, 452px);
      height: 665px;
      max-height: none;
      margin-inline: auto;
    }

    .event-detail-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .event-detail-grid {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .event-detail-grid div {
      padding: 10px 12px;
    }

    .event-detail-grid dt {
      margin-bottom: 2px;
    }

    @media (max-width: 600px) {
      .event-detail-media {
        height: auto;
        aspect-ratio: 452 / 665;
      }
    }
  </style>
</head>
<body>
    <header class="top">
    <div class="brand" style="text-align: center;">

      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">
      
      <h1 class="nav-gold">
        <span 
          data-en="Tu<br>Mejor<br>Version" 
          data-es="Tu<br>Mejor<br>Versión">
        </span>
      </h1> 
      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">

      <!-- Right side: Auth controls -->
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>

    </div>

    <div style="margin-bottom: 20px;">
      <!-- 🌐 Language toggle buttons -->
      <span class="lang-toggle">
        <button type="button" class="lang-btn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" onclick="setLanguage('es')">🇲🇽 ES</button>
      </span>
    </div>
    
    <div class="nav-container">
      <!-- Hamburger Button -->
      <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Overlay Menu -->
      <nav id="mobile-menu" class="mobile-menu">

        <a href="/" class="nav-btn">
          <span data-en="Home" data-es="Inicio"></span>
        </a>

        <a href="/courses" class="nav-btn">
          <span data-en="Courses" data-es="Cursos"></span>
        </a>

        <a href="/events" class="nav-btn">
          <span data-en="Events" data-es="Eventos"></span>
        </a>

        <a href="/donate" class="nav-btn">
          <span data-en="Donate" data-es="Donar"></span>
        </a>        <a href="/forum" class="nav-btn">
          <span data-en="Forum" data-es="Foro"></span>
        </a>

        <a href="/about" class="nav-btn">
          <span data-en="About Us" data-es="Sobre Nosotros"></span>
        </a>

        <div id="auth-links" class="auth-links"></div>

      </nav>
    </div>
  </header>

  <div id="me" class="section-card">
  <h3>Current User</h3>
  <p><b>Name:</b> <span id="me-name"></span></p>
  <p><b>Email:</b> <span id="me-email"></span></p>
  </div>

  <main class="container" style="padding-top:18px;">
    <section class="section-card event-detail-card">
      <div id="event-image-frame" class="event-detail-media" style="display:none;">
        <img id="event-image" />
      </div>

      <h1 id="title" class="nav-gold">Event</h1>

      <section class="event-detail-section event-information-section">
        <h2 data-en="About This Event" data-es="Sobre Este Evento">About This Event</h2>
        <p id="about"></p>

        <h2 data-en="Event Details" data-es="Detalles del Evento">Event Details</h2>
        <dl class="event-detail-grid">
          <div>
            <dt data-en="Day" data-es="Día">Day</dt>
            <dd id="event-day"></dd>
          </div>
          <div>
            <dt data-en="Time" data-es="Hora">Time</dt>
            <dd id="event-time"></dd>
          </div>
          <div>
            <dt data-en="Presenter" data-es="Presentadora">Presenter</dt>
            <dd id="presenter"></dd>
          </div>
          <div>
            <dt data-en="Location" data-es="Ubicación">Location</dt>
            <dd id="loc"></dd>
          </div>
          <div>
            <dt data-en="Capacity" data-es="Capacidad">Capacity</dt>
            <dd><span id="cap"></span> · <span id="count"></span> <span data-en="registered" data-es="registrados">registered</span></dd>
          </div>
        </dl>

        <h2 data-en="Requirements" data-es="Requisitos">Requirements</h2>
        <p id="req"></p>
      </section>

      <section class="event-detail-section event-participation-section">
        <h2 id="event-actions-title" data-en="Participation" data-es="Participación">Participation</h2>
        <div id="actions" class="event-actions"></div>
      </section>
      <div id="admin"></div>

      <div style="margin-top:10px;">
        <a
          href="#"
          onclick="shareEventOnFacebook(event)"
          class="fb-share-btn"
          data-en="Share event on Facebook"
          data-es="Compartir evento en Facebook"
        >
          Compartir evento en Facebook
        </a>
      </div>
    </section>

    <section class="section-card feedback-section">
      <h1 class="section-title nav-gold" data-en="Leave Feedback" data-es="Dejar Comentarios">Leave Feedback</h1>

      <form id="event-feedback-form" class="feedback-form">
        <label for="event-feedback-text" data-en="Your feedback" data-es="Tus comentarios">
          Your feedback
        </label>

        <div class="emoji-toolbar" id="emoji-toolbar">
          <button type="button" class="emoji-btn" data-emoji="😀">😀</button>
          <button type="button" class="emoji-btn" data-emoji="😊">😊</button>
          <button type="button" class="emoji-btn" data-emoji="🙏">🙏</button>
          <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
          <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
          <button type="button" class="emoji-btn" data-emoji="👏">👏</button>
          <button type="button" class="emoji-btn" data-emoji="✨">✨</button>
          <button type="button" class="emoji-btn" data-emoji="🙌">🙌</button>
        </div>

        <textarea
          id="event-feedback-text"
          name="feedback"
          rows="5"
          maxlength="1000"
          placeholder="Write your feedback here..."
          data-en-placeholder="Write your feedback here..."
          data-es-placeholder="Escribe tus comentarios aquí..."
          required
        ></textarea>

        <div class="feedback-actions">
          <button type="submit" class="btn" data-en="Submit Feedback" data-es="Enviar Comentarios">
            Submit Feedback
          </button>
          <span id="event-feedback-status" class="muted"></span>
        </div>
      </form>

      <div class="feedback-list-wrap">
        <h3 data-en="Comments" data-es="Comentarios">Comments</h3>
        <ul id="event-feedback-list" class="feedback-list">
          <li class="muted" data-en="No feedback yet." data-es="Aún no hay comentarios.">No feedback yet.</li>
        </ul>
      </div>
    </section>
  </main>
  
  <script src="/static/js/app.js"></script>
  <script src="/static/js/facebook.js"></script>

  <script>
  function q(name){return new URLSearchParams(location.search).get(name)}
  function eventSafe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function imageSrc(value){
    if(!value) return '';
    if(/^https?:\/\//i.test(value) || value.startsWith('/')) return value;
    return `/static/images/${value}`;
  }
  function currentLang(){
    return localStorage.getItem('lang') === 'es' ? 'es' : 'en';
  }
  function eventText(en, es){
    return currentLang() === 'es' ? es : en;
  }
  const eventTranslations = {
    '6': {
      es: {
        about: 'Este evento celebra el 4.º aniversario de este programa que ofrece apoyo a nuestra comunidad. Presentaremos a nuestros asistentes temas sobre emprendimiento, salud mental, familia y poesía, junto con presentaciones musicales en vivo.',
        requirements: '$50 por boleto de adulto (15 años o más)\n$25 por niño'
      }
    }
  };
  let loadedEvent = null;
  let loadedEventDate = null;
  function translatedEventField(field){
    const lang = currentLang();
    const eventId = loadedEvent?.id ? String(loadedEvent.id) : q('id');
    const translatedValue = eventTranslations[eventId]?.[lang]?.[field];
    return translatedValue || loadedEvent?.[field] || '';
  }
  function updateEventCopy(){
    if (!loadedEvent) return;
    document.getElementById('about').textContent = translatedEventField('about');
    document.getElementById('req').textContent = translatedEventField('requirements');
  }
  function updateEventDate(){
    if (!loadedEventDate) return;
    const locale = currentLang() === 'es' ? 'es-US' : 'en-US';
    const dateFormatter = new Intl.DateTimeFormat(locale, {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric',
      timeZone: 'America/New_York'
    });
    const timeFormatter = new Intl.DateTimeFormat(locale, {
      hour: 'numeric',
      minute: '2-digit',
      timeZoneName: 'short',
      timeZone: 'America/New_York'
    });
    document.getElementById('event-day').textContent = dateFormatter.format(loadedEventDate);
    document.getElementById('event-time').textContent = timeFormatter.format(loadedEventDate);
  }
  function applyEventLanguage(){
    const lang = currentLang();
    if (typeof updateLanguage === 'function') updateLanguage(lang);
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en-placeholder][data-es-placeholder]').forEach((el) => {
      el.placeholder = lang === 'es' ? el.dataset.esPlaceholder : el.dataset.enPlaceholder;
    });
  }
  const baseSetLanguage = window.setLanguage;
  window.setLanguage = function(lang){
    if (typeof baseSetLanguage === 'function') baseSetLanguage(lang);
    else localStorage.setItem('lang', lang);
    applyEventLanguage();
    updateEventDate();
    updateEventCopy();
  };
  async function api(path, opts={}){
    const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
    const ct=r.headers.get('content-type')||'';
    const b=ct.includes('application/json')?await r.json().catch(()=>null):await r.text().catch(()=>null);
    if(!r.ok) throw new Error((b&&b.error)||'Request failed');
    return b;
  }
  (async()=>{
    const id=q('id');
    const e=await api(`/api/events/${id}`);
    loadedEvent = e;
    loadedEventDate = new Date(e.date);

    document.title = e.name;
    document.getElementById('title').textContent=e.name;
    updateEventCopy();
    updateEventDate();
    document.getElementById('presenter').textContent = e.presenter || '';
    document.getElementById('loc').textContent = e.location;
    document.getElementById('cap').textContent = e.capacity || 0;
    document.getElementById('count').textContent = e.enrolled_count;

    const img = document.getElementById('event-image');
    const imgFrame = document.getElementById('event-image-frame');
    if (img && e.image_url) {
      img.src = imageSrc(e.image_url);
      img.alt = e.name || 'Event image';
      if (imgFrame) imgFrame.style.display = 'block';
    }

    const me = await api('/api/me').catch(()=>null);
    let html='';
    let adminRegistrationHtml='';
    if(!me){
      html = e.uses_external_participants
        ? '<p data-en="Participation for this event is managed by the administrator." data-es="La participación para este evento es administrada por el administrador.">Participation for this event is managed by the administrator.</p>'
        : '<p><a href="/login.html" data-en="Login" data-es="Iniciar sesión">Login</a> <span data-en="to register." data-es="para registrarte.">to register.</span></p>';
    }
    else {
      if (e.uses_external_participants) {
        html += '<p data-en="Participation for this event is managed by the administrator." data-es="La participación para este evento es administrada por el administrador.">Participation for this event is managed by the administrator.</p>';
      } else {
        const registrationButton = e.enrolled ? '<button id="cancel" data-en="Cancel Registration" data-es="Cancelar Registro">Cancel Registration</button>' : '<button id="enroll" data-en="Register" data-es="Registrarse">Register</button>';
        if (me.role === 'admin') adminRegistrationHtml = registrationButton;
        else html += registrationButton;
      }
      if(me.role==='admin') {
        const actionsTitle = document.getElementById('event-actions-title');
        actionsTitle.setAttribute('data-en', 'Edit and Delete Event');
        actionsTitle.setAttribute('data-es', 'Editar y Eliminar Evento');
        html += `
          <a class="btn" href="/create-event.html?id=${encodeURIComponent(id)}" data-en="Edit Event" data-es="Editar Evento">Edit Event</a>
          <button id="delete" data-en="Delete Event" data-es="Eliminar Evento">Delete Event</button>`;
      }
    }
    document.getElementById('actions').innerHTML = html;
    applyEventLanguage();

    const bindRegistrationButtons=()=>{
      const enrollBtn=document.getElementById('enroll');
      if(enrollBtn) enrollBtn.addEventListener('click', async()=>{await api(`/api/events/${id}/enroll`,{method:'POST'}); location.reload();});
      const cancelBtn=document.getElementById('cancel');
      if(cancelBtn) cancelBtn.addEventListener('click', async()=>{await api(`/api/events/${id}/cancel`,{method:'POST'}); location.reload();});
    };
    bindRegistrationButtons();
    const delBtn=document.getElementById('delete');
    if(delBtn) delBtn.addEventListener('click', async()=>{if(confirm(eventText('Delete this event? Feedback will be saved for future display.', '¿Eliminar este evento? Los comentarios se guardarán para mostrarlos en el futuro.'))){await api(`/api/events/${id}`,{method:'DELETE'}); location.href='/events.html';}});

    if(me && me.role==='admin'){
      const [assigned, users] = await Promise.all([
        api(`/api/admin/events/${id}/participants`),
        api(`/api/events/${id}/registered`)
      ]);
      const assignedHtml = assigned.length ? `
        <section class="event-detail-section">
          <h3 data-en="Assigned Participants" data-es="Participantes Asignados">Assigned Participants</h3>
          <p>${assigned.length} participant${assigned.length === 1 ? '' : 's'}</p>
          <div style="max-height:18rem;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;border:1px solid #ddd;border-radius:.5rem;padding:.5rem;">
            <ul>${assigned.map(person => `<li><strong>${eventSafe(person.name)}</strong>${person.phone ? ` — ${eventSafe(person.phone)}` : ''}${person.address ? `<br><small>${eventSafe(person.address)}</small>` : ''}</li>`).join('')}</ul>
          </div>
        </section>` : '';
      const registeredHtml = `
        <section class="event-detail-section">
          <h3 data-en="Registered Users" data-es="Usuarios Registrados">Registered Users</h3>
          ${users.length ? '<ul>'+users.map(u=>`<li>${eventSafe(u.name)} (${eventSafe(u.email)})</li>`).join('')+'</ul>' : '<p data-en="No registrations." data-es="No hay registros.">No registrations.</p>'}
          ${adminRegistrationHtml}
        </section>`;
      document.getElementById('admin').innerHTML = assignedHtml + registeredHtml;
      applyEventLanguage();
      bindRegistrationButtons();
    }
  })().catch(err=>{document.getElementById('about').textContent=err.message;});
  </script>
</body></html>
