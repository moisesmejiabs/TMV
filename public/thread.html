    <main class="container" style="padding-top:18px;max-width:900px;">
      <h1 id="title">Thread</h1>
      <div id="posts"></div>
      <div id="reply"></div>
      <p><a href="/forum.html">Back</a></p>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
      function q(name){return new URLSearchParams(location.search).get(name)}
      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      async function api(path, opts={}){
        const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
        const j=await r.json().catch(()=>null);
        if(!r.ok) throw new Error(j?.error || 'Failed');
        return j;
      }
      (async()=>{
        const id=q('id');
        const t = await api(`/api/forum/threads/${id}`);
        document.title=t.title;
        document.getElementById('title').textContent=t.title;
        const posts = await api(`/api/forum/threads/${id}/posts`);
        document.getElementById('posts').innerHTML = posts.length ? posts.map(p=>`<div style="border:1px solid #ddd;padding:10px;margin:10px 0;">
          <div style="font-size:12px;opacity:.8;">${escapeHtml(p.author_name)} · ${new Date(p.created_at).toLocaleString()}</div>
          <div style="white-space:pre-wrap;">${escapeHtml(p.body).replace(/\n/g, '<br>')}</div>
        </div>`).join('') : '<p>No posts.</p>';

        const me = await api('/api/me').catch(()=>null);
        if(!me){
          document.getElementById('reply').innerHTML = '<p><a href="/login.html">Login</a> to reply.</p>';
        } else {
          document.getElementById('reply').innerHTML = '<h3>Reply</h3><form id="f"><textarea name="body" rows="5" style="width:100%" required></textarea><br><br><button type="submit">Reply</button></form><p id="msg"></p>';
          document.getElementById('f').addEventListener('submit', async (e)=>{
            e.preventDefault();
            const fd=new FormData(e.target);
            try{ await api(`/api/forum/threads/${id}/reply`, {method:'POST', body: JSON.stringify({body: fd.get('body')})}); location.reload(); }
            catch(err){ document.getElementById('msg').textContent = err.message; }
          });
        }
      })();
    </script>
