<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu Mejor Versión</title>
  <link rel="stylesheet" href="/static/css/style.css?v=event-info-group-20260725" />
  <style>
    #events-list .event-summary {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      width: 100%;
    }
    #events-list .event-thumbnail {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 192px;
      overflow: hidden;
      border: 1px solid rgba(91, 45, 109, 0.14);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.72);
    }
    #events-list .event-thumbnail img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    #events-list .event-thumbnail-placeholder {
      flex-direction: column;
      gap: 4px;
      color: #765f7d;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
    }
    #events-list .event-thumbnail-placeholder::before {
      content: "▧";
      font-size: 1.6rem;
      font-weight: 400;
      opacity: 0.7;
    }
    #events-list .event-summary-details {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    #events-list .event-description {
      margin-top: 5px;
    }
    @media (max-width: 520px) {
      #events-list .event-summary {
        grid-template-columns: 168px minmax(0, 1fr);
        gap: 12px;
      }
      #events-list .event-thumbnail {
        width: 168px;
        height: 144px;
      }
    }
  </style>
</head>
<body class="events-listing-page">
    <header class="top">
    <div class="brand" style="text-align: center;">

      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">
      
      <h1 class="nav-gold">
        <span 
          data-en="Tu<br>Mejor<br>Version" 
          data-es="Tu<br>Mejor<br>Versión">
        </span>
      </h1> 
      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">

      <!-- Right side: Auth controls -->
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>

    </div>

    <div style="margin-bottom: 20px;">
      <!-- 🌐 Language toggle buttons -->
      <span class="lang-toggle">
        <button type="button" class="lang-btn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" onclick="setLanguage('es')">🇲🇽 ES</button>
      </span>
    </div>
    
    <div class="nav-container">
      <!-- Hamburger Button -->
      <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Overlay Menu -->
      <nav id="mobile-menu" class="mobile-menu">

        <a href="/" class="nav-btn">
          <span data-en="Home" data-es="Inicio"></span>
        </a>

        <a href="/courses" class="nav-btn">
          <span data-en="Courses" data-es="Cursos"></span>
        </a>

        <a href="/events" class="nav-btn">
          <span data-en="Events" data-es="Eventos"></span>
        </a>

        <a href="/donate" class="nav-btn">
          <span data-en="Donate" data-es="Donar"></span>
        </a>

        <a href="/media" class="nav-btn">
          <span data-en="Media" data-es="Medios"></span>
        </a>

        <a href="/forum" class="nav-btn">
          <span data-en="Forum" data-es="Foro"></span>
        </a>

        <a href="/about" class="nav-btn">
          <span data-en="About Us" data-es="Sobre Nosotros"></span>
        </a>

        <a href="/testimonials" class="nav-btn">
          <span data-en="Testimonials" data-es="Testimonios"></span>
        </a>

        <div id="auth-links" class="auth-links"></div>

      </nav>
    </div>
  </header>
    <h1 class="nav-gold">        
      <span 
        data-en="Events" 
        data-es="Eventos">
      </span>
    </h1>
    <main>
      <section class="section-card events-card">
        <h2><span data-en="Events" data-es="Eventos"></span></h2>
        <ul class="event-list" id="events-list">
          <li>Loading events...</li>
        </ul>
        <div id="create-event-container" style="display:none;"></div>
      </section>
    </main>

    <script src="/static/js/app.js"></script>

    <script>
      loadEvents();
    </script>
</body>
</html>
