          alt="Logo"
          class="brand-img flipped">

      <!-- Right side: Auth controls -->

    </div>

    <div class="nav-container">
      <!-- Hamburger Button -->
      <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Overlay Menu -->
      <nav id="mobile-menu" class="mobile-menu">

        <a href="/" class="nav-btn">

        <a href="/courses" class="nav-btn">

      </nav>
    </div>>
  </header>

  <main class="container" style="padding-top:18px;max-width:520px;">
    <h1>Login</h1>
    <form id="f">
      <label>Email<br><input name="email" type="email" required></label><br><br>
      <label>Password<br><input name="password" type="password" required></label><br><br>
      <button type="submit">Login</button>
    </form>
    <p id="msg"></p>
    <p><a href="/">Home</a> · <a href="/register.html">Register</a></p>
  </main>
  <script>
  async function api(path, opts={}){
    const r = await fetch(path, {credentials:'include', headers:{'content-type':'application/json', ...(opts.headers||{})}, ...opts});
    const body = await r.json().catch(()=>null);
    if(!r.ok) throw new Error(body?.error || 'Login failed');
    return body;
  }
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {email: fd.get('email'), password: fd.get('password')};
    try{
      await api('/api/auth/login', {method:'POST', body: JSON.stringify(payload)});
      location.href = '/';
    }catch(err){
      document.getElementById('msg').textContent = err.message;
    }
  });
  </script>
</body>
</html>
