  <div id="me" class="section-card">

  <p><b>Name:</b> <span id="me-name"></span></p>

  <main class="container" style="padding-top:18px;max-width:520px;">
    <h1>Login</h1>
    <form id="f">
      <label>Email<br><input name="email" type="email" required></label><br><br>
      <label>Password<br><input name="password" type="password" required></label><br><br>
      <button type="submit">Login</button>
    </form>
    <p id="msg"></p>
    <p><a href="/">Home</a> · <a href="/register.html">Register</a></p>
  </main>
  <script src="/static/js/app.js"></script>
  <script>
  async function api(path, opts={}){
    const r = await fetch(path, {credentials:'include', headers:{'content-type':'application/json', ...(opts.headers||{})}, ...opts});
    const body = await r.json().catch(()=>null);
    if(!r.ok) throw new Error(body?.error || 'Login failed');
    return body;
  }
  function destinationAfterLogin() {
    const next = new URLSearchParams(location.search).get('next');
    return next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  }
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {email: fd.get('email'), password: fd.get('password')};
    const msgEl = document.getElementById('msg');
    msgEl.textContent = '';
    try{
      const resp = await api('/api/auth/login', {method:'POST', body: JSON.stringify(payload)});

      if (resp && resp.ack_required) {
        // show inline acknowledgement UI
        const pending = resp.pending || [];
        const ackToken = resp.ack_token;
        msgEl.innerHTML = '';

        const list = document.createElement('div');
        list.innerHTML = `<h3>Pending documents</h3>` + (pending.length ? `<ul>${pending.map(d => `<li><a href="${d.download_url}" target="_blank">${d.title}</a></li>`).join('')}</ul>` : '<p>No pending documents listed.</p>') + '<p><button id="ack-all">Acknowledge and continue</button></p>';
        msgEl.appendChild(list);

        document.getElementById('ack-all').addEventListener('click', async () => {
          try {
            for (const d of pending) {
              await fetch(`/api/agreement-docs/${d.id}/acknowledge`, {
                method: 'POST',
                headers: { 'authorization': 'Bearer ' + ackToken }
              });
            }

            // complete login (exchange ack token for session cookie)
            const completeResp = await fetch('/api/auth/login/complete', {
              method: 'POST',
              credentials: 'include',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ ack_token: ackToken })
            });
            const completeBody = await completeResp.json().catch(()=>null);
            if (!completeResp.ok) throw new Error(completeBody?.error || 'Failed to complete login');
            location.href = destinationAfterLogin();
          } catch (err) {
            msgEl.textContent = err.message || 'Acknowledgement failed';
          }
        });

      } else {
        // normal success — the server should have set a session cookie
        location.href = destinationAfterLogin();
      }
    }catch(err){
      document.getElementById('msg').textContent = err.message;
    }
  });
  </script>
</body>
