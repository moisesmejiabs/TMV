<script src="/static/js/app.js"></script>
<script>
async function api(path, opts={}){
  const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error || 'Failed');
  return j;
}
(async () => {
  try {
    console.log("ADMIN PAGE: starting");

    const me = await api('/api/me');
    console.log("ADMIN PAGE: /api/me =", me);

    if (!me) {
      console.warn("ADMIN PAGE: not logged in → redirecting to login");
      window.location.href = "/login.html";
      return;
    }

    if (me.role !== 'admin') {
      console.warn("ADMIN PAGE: non-admin user → redirecting to profile");
      window.location.href = "/adminuser.html";
      return;
    }

    const users = await api('/api/admin/users');
    console.log("ADMIN PAGE: /api/admin/users =", users);

    const usersEl = document.getElementById('users');
    if (!usersEl) {
      console.error("ADMIN PAGE: #users element not found");
      return;
    }

    usersEl.innerHTML =
      '<ul>' +
      users.map(u => {
        const isAdmin = u.role === 'admin';
        return `
          <li>
            ${u.id} — ${u.name} (${u.email}) [${u.role}]
            <button
              data-id="${u.id}"
              data-name="${escapeHtml(u.name || '')}"
              class="toggle-admin">
              ${isAdmin ? 'Remove Admin' : 'Make Admin'}
            </button>
            <button
              data-id="${u.id}"
              data-name="${escapeHtml(u.name || '')}"
              class="del">
              Delete
            </button>
          </li>
        `;
      }).join('') +
      '</ul>';

    document.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');

        console.log("DELETE CLICK: id =", id, "name =", name);

        if (!confirm(`Delete user ${name || id}?`)) {
          console.log("DELETE CANCELLED");
          return;
        }

        try {
          const result = await api(`/api/admin/users/${id}`, {
            method: 'DELETE'
          });

          console.log("DELETE SUCCESS:", result);
          location.reload();
        } catch (err) {
          console.error("DELETE FAILED:", err);
          alert(`Delete failed: ${err.message}`);
        }
      });
    });

    document.querySelectorAll('.toggle-admin').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const rowText = btn.parentElement ? btn.parentElement.textContent : '';
        const currentlyAdmin = rowText.includes('[admin]');
        const newRole = currentlyAdmin ? 'user' : 'admin';

        console.log("TOGGLE ADMIN CLICK:");
        console.log("  id =", id);
        console.log("  currentlyAdmin =", currentlyAdmin);
        console.log("  newRole =", newRole);

        if (!confirm(`Change user ${id} role to "${newRole}"?`)) {
          console.log("ROLE CHANGE CANCELLED");
          return;
        }

        try {
          const result = await api(`/api/admin/users/${id}/role`, {
            method: 'PATCH',
            body: JSON.stringify({ role: newRole })
          });

          console.log("ROLE CHANGE SUCCESS:", result);
          location.reload();
        } catch (err) {
          console.error("ROLE CHANGE FAILED:", err);
          alert(`Role update failed: ${err.message}`);
        }
      });
    });

  } catch (err) {
    console.error("ADMIN PAGE FAILED:", err);
    alert(err.message || 'Failed to load admin page');
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  // Load and display course feedback for approval
  async function loadCourseFeedbackAdmin() {
    try {
      const items = await api('/api/admin/course-feedback?pending=true');
      const container = document.getElementById('course-feedback-admin');
      
      if (!items.length) {
        container.innerHTML = '<p>No pending feedback.</p>';
        return;
      }

      container.innerHTML = items.map(f => `
        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
          <strong>${escapeHtml(f.course_name || 'Unknown Course')}</strong><br>
          <em>${escapeHtml(f.name || 'User')}</em> - ${new Date(f.created_at).toLocaleDateString()}
          <p style="margin-top: 8px;">${escapeHtml(f.feedback)}</p>
          <button data-id="${f.id}" class="approve-course-feedback-btn">Approve</button>
          <button data-id="${f.id}" class="delete-course-feedback-btn">Delete</button>
        </div>
      `).join('');

      document.querySelectorAll('.approve-course-feedback-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const feedbackId = btn.getAttribute('data-id');
          try {
            await api(`/api/course-feedback/${feedbackId}/approve`, { method: 'PATCH' });
            loadCourseFeedbackAdmin();
          } catch (err) {
            alert('Failed to approve: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.delete-course-feedback-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const feedbackId = btn.getAttribute('data-id');
          if (!confirm('Delete this feedback?')) return;
          try {
            await api(`/api/course-feedback/${feedbackId}`, { method: 'DELETE' });
            loadCourseFeedbackAdmin();
          } catch (err) {
            alert('Failed to delete: ' + err.message);
          }
        });
      });
    } catch (err) {
      console.error('Error loading course feedback:', err);
      document.getElementById('course-feedback-admin').innerHTML = '<p>Error loading feedback.</p>';
    }
  }

  // Load and display event feedback for approval
  async function loadEventFeedbackAdmin() {
    try {
      const items = await api('/api/admin/event-feedback?pending=true');
      const container = document.getElementById('event-feedback-admin');
      
      if (!items.length) {
        container.innerHTML = '<p>No pending feedback.</p>';
        return;
      }

      container.innerHTML = items.map(f => `
        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
          <strong>${escapeHtml(f.event_name || 'Unknown Event')}</strong><br>
          <em>${escapeHtml(f.name || 'User')}</em> - ${new Date(f.created_at).toLocaleDateString()}
          <p style="margin-top: 8px;">${escapeHtml(f.feedback)}</p>
          <button data-id="${f.id}" class="approve-event-feedback-btn">Approve</button>
          <button data-id="${f.id}" class="delete-event-feedback-btn">Delete</button>
        </div>
      `).join('');

      document.querySelectorAll('.approve-event-feedback-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const feedbackId = btn.getAttribute('data-id');
          try {
            await api(`/api/event-feedback/${feedbackId}/approve`, { method: 'PATCH' });
            loadEventFeedbackAdmin();
          } catch (err) {
            alert('Failed to approve: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.delete-event-feedback-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const feedbackId = btn.getAttribute('data-id');
          if (!confirm('Delete this feedback?')) return;
          try {
            await api(`/api/event-feedback/${feedbackId}`, { method: 'DELETE' });
            loadEventFeedbackAdmin();
          } catch (err) {
            alert('Failed to delete: ' + err.message);
          }
        });
      });
    } catch (err) {
      console.error('Error loading event feedback:', err);
      document.getElementById('event-feedback-admin').innerHTML = '<p>Error loading feedback.</p>';
    }
  }

  // Load and display testimonials for approval
  async function loadTestimonialsAdmin() {
    try {
      const items = await api('/api/admin/testimonies?pending=true');
      const container = document.getElementById('testimonials-admin');
      
      if (!items.length) {
        container.innerHTML = '<p>No pending testimonials.</p>';
        return;
      }

      container.innerHTML = items.map(t => `
        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
          <strong>${escapeHtml(t.name || 'Anonymous')}</strong> (${escapeHtml(t.email || '')}) - ${new Date(t.created_at).toLocaleDateString()}
          <p style="margin-top: 8px; white-space: pre-wrap;">${escapeHtml(t.testimony)}</p>
          <button data-id="${t.id}" class="approve-testimony-btn">Approve</button>
          <button data-id="${t.id}" class="delete-testimony-btn">Delete</button>
        </div>
      `).join('');

      document.querySelectorAll('.approve-testimony-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ testimony_approved: 1 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to approve: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.delete-testimony-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          if (!confirm('Delete this testimony?')) return;
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ testimony_approved: 0 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to delete: ' + err.message);
          }
        });
      });
    } catch (err) {
      console.error('Error loading testimonials:', err);
      document.getElementById('testimonials-admin').innerHTML = '<p>Error loading testimonials.</p>';
    }
  }

  // Load all approval panels
  loadCourseFeedbackAdmin();
  loadEventFeedbackAdmin();
  loadTestimonialsAdmin();
})();
</script>
