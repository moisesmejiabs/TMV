<script>
async function api(path, opts={}){
  const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.error || 'Failed');
  return j;
}
(async () => {
  try {
    console.log("ADMIN PAGE: starting");

    const me = await api('/api/me');
    console.log("ADMIN PAGE: /api/me =", me);

    if (!me) {
      console.warn("ADMIN PAGE: not logged in → redirecting to login");
      window.location.href = "/login.html";
      return;
    }

    if (me.role !== 'admin') {
      console.warn("ADMIN PAGE: non-admin user → redirecting to profile");
      window.location.href = "/adminuser.html";
      return;
    }

    const users = await api('/api/admin/users');
    console.log("ADMIN PAGE: /api/admin/users =", users);

    const usersEl = document.getElementById('users');
    if (!usersEl) {
      console.error("ADMIN PAGE: #users element not found");
      return;
    }

    usersEl.innerHTML =
      '<ul>' +
      users.map(u => {
        const isAdmin = u.role === 'admin';
        return `
          <li>
            ${u.id} — ${u.name} (${u.email}) [${u.role}] accepted docs: ${u.docs_accepted || 0}
            <button
              data-id="${u.id}"
              data-name="${escapeHtml(u.name || '')}"
              class="toggle-admin">
              ${isAdmin ? 'Remove Admin' : 'Make Admin'}
            </button>
            <button
              data-id="${u.id}"
              data-name="${escapeHtml(u.name || '')}"
              class="del">
              Delete
            </button>
          </li>
        `;
      }).join('') +
      '</ul>';

    document.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');

        console.log("DELETE CLICK: id =", id, "name =", name);

        if (!confirm(`Delete user ${name || id}?`)) {
          console.log("DELETE CANCELLED");
          return;
        }

        try {
          const result = await api(`/api/admin/users/${id}`, {
            method: 'DELETE'
          });

          console.log("DELETE SUCCESS:", result);
          location.reload();
        } catch (err) {
          console.error("DELETE FAILED:", err);
          alert(`Delete failed: ${err.message}`);
        }
      });
    });

    document.querySelectorAll('.toggle-admin').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        const rowText = btn.parentElement ? btn.parentElement.textContent : '';
        const currentlyAdmin = rowText.includes('[admin]');
        const newRole = currentlyAdmin ? 'user' : 'admin';

        console.log("TOGGLE ADMIN CLICK:");
        console.log("  id =", id);
        console.log("  currentlyAdmin =", currentlyAdmin);
        console.log("  newRole =", newRole);

        if (!confirm(`Change user ${id} role to "${newRole}"?`)) {
          console.log("ROLE CHANGE CANCELLED");
          return;
        }

        try {
          const result = await api(`/api/admin/users/${id}/role`, {
            method: 'PATCH',
            body: JSON.stringify({ role: newRole })
          });

          console.log("ROLE CHANGE SUCCESS:", result);
          location.reload();
        } catch (err) {
          console.error("ROLE CHANGE FAILED:", err);
          alert(`Role update failed: ${err.message}`);
        }
      });
    });

    const agreementDocsEl = document.getElementById('agreement-docs');
    const agreementForm = document.getElementById('agreement-form');

    async function loadAgreementDocs() {
      try {
        const docs = await api('/api/admin/agreement-docs');
        if (!docs.length) {
          agreementDocsEl.innerHTML = '<p>No agreement documents uploaded yet.</p>';
          return;
        }

        agreementDocsEl.innerHTML = `
          <ul>
            ${docs.map((doc) => `
              <li style="margin-bottom:12px;">
                <strong>${escapeHtml(doc.title)}</strong> by ${escapeHtml(doc.author)}
                <a href="/api/agreement-docs/${doc.id}/pdf" target="_blank">Download</a>
                <button data-id="${doc.id}" class="delete-agreement" type="button">Delete</button>
              </li>
            `).join('')}
          </ul>
        `;

        document.querySelectorAll('.delete-agreement').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            if (!confirm('Delete this agreement document?')) return;
            try {
              const result = await api(`/api/admin/agreement-docs/${id}`, { method: 'DELETE' });
              console.log('Agreement delete result', result);
              await loadAgreementDocs();
            } catch (err) {
              console.error('Agreement delete failed', err);
              alert(`Delete failed: ${err.message}`);
            }
          });
        });
      } catch (err) {
        agreementDocsEl.innerHTML = `<p>Error loading agreement documents: ${escapeHtml(err.message)}</p>`;
      }
    }

    if (agreementForm) {
      agreementForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
          const resp = await fetch('/api/admin/agreement-docs', {
            method: 'POST',
            credentials: 'include',
            body: formData
          });
          const body = await resp.json().catch(() => null);
          if (!resp.ok) throw new Error(body?.error || 'Upload failed');
          agreementForm.reset();
          await loadAgreementDocs();
          await loadAcknowledgementStatus();
        } catch (err) {
          alert(`Upload failed: ${err.message}`);
        }
      });
    }

    async function loadAcknowledgementStatus() {
      try {
        const ackEl = document.getElementById('acknowledgement-status');
        if (!ackEl) return;
        const docs = await api('/api/admin/agreement-docs/acknowledgements');
        if (!docs.length) {
          ackEl.innerHTML = '<p>No documents or acknowledgements available.</p>';
          return;
        }

        ackEl.innerHTML = docs.map((doc) => `
          <div style="border:1px solid #ddd; padding:12px; margin-bottom:16px;">
            <h3 style="margin:0 0 8px;">${escapeHtml(doc.title)} <small style="font-size:0.9em; color:#555;">by ${escapeHtml(doc.author)}</small></h3>
            <p style="margin:0 0 12px;">Accepted: ${doc.accepted_users.length} · Pending: ${doc.pending_users.length}</p>
            <div style="margin-bottom:10px;">
              <strong>Accepted users</strong>
              ${doc.accepted_users.length ? `<ul>${doc.accepted_users.map((user) => `
                <li style="margin-bottom:6px;">
                  ${escapeHtml(user.name)} (${escapeHtml(user.email)}) — accepted at ${escapeHtml(user.accepted_at)}
                  <button type="button" data-doc-id="${doc.id}" data-user-id="${user.id}" class="revoke-ack">Resend request</button>
                </li>
              `).join('')}</ul>` : '<p>No accepted users yet.</p>'}
            </div>
            <div>
              <strong>Pending users</strong>
              ${doc.pending_users.length ? `<ul>${doc.pending_users.map((user) => `
                <li>${escapeHtml(user.name)} (${escapeHtml(user.email)})</li>
              `).join('')}</ul>` : '<p>No pending users.</p>'}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.revoke-ack').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const docId = btn.getAttribute('data-doc-id');
            const userId = btn.getAttribute('data-user-id');
            if (!confirm('Resend request for this user by revoking acknowledgement?')) return;
            try {
              await api(`/api/admin/agreement-docs/${docId}/acknowledgements/${userId}`, { method: 'DELETE' });
              await loadAgreementDocs();
              await loadAcknowledgementStatus();
            } catch (err) {
              alert(`Failed to resend request: ${err.message}`);
            }
          });
        });
      } catch (err) {
        const ackEl = document.getElementById('acknowledgement-status');
        if (ackEl) ackEl.innerHTML = `<p>Error loading acknowledgements: ${escapeHtml(err.message)}</p>`;
      }
    }

    await loadAgreementDocs();
    await loadAcknowledgementStatus();

  } catch (err) {
    console.error("ADMIN PAGE FAILED:", err);
    alert(err.message || 'Failed to load admin page');
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  async function loadCourseFeedbackAdmin() {

      if (!items.length) {
        container.innerHTML = '<p>No feedback.</p>';
        return;

      container.innerHTML = items.map(f => `

            ${f.approved === 0 ? `<button data-id="${f.id}" class="approve-course-feedback-btn" style="background-color: #4CAF50; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Approve</button>` : `<button data-id="${f.id}" class="unapprove-course-feedback-btn" style="background-color: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Remove Approval</button>`}

      console.error('Error loading course feedback:', err);
      document.getElementById('course-feedback-admin').innerHTML = '<p>Error loading feedback.</p>';

    if (!container) return;

    try {
      const videos = await api('/api/youtube-slider');
      if (!videos.length) {
        container.innerHTML = '<p>No slider videos yet.</p>';
        return;
      }

      container.innerHTML = `
        <ul>
          ${videos.map((video) => `
            <li style="margin-bottom:10px;">
              <strong>${escapeHtml(video.title || '')}</strong>
              <a href="${escapeHtml(video.youtube_url || '')}" target="_blank" rel="noopener noreferrer">Open</a>
              <button type="button" class="delete-youtube-slider-video" data-id="${video.id}">Delete</button>
            </li>
          `).join('')}
        </ul>
      `;

      document.querySelectorAll('.delete-youtube-slider-video').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (!confirm('Delete this slider video?')) return;
          try {
            await api(`/api/admin/youtube-slider/${id}`, { method: 'DELETE' });
            await loadYoutubeSliderAdmin();
          } catch (err) {
            alert('Failed to delete video: ' + err.message);
          }
        });
      });
    } catch (err) {
      container.innerHTML = '<p>Error loading slider videos.</p>';
    }
  }

  const youtubeSliderForm = document.getElementById('youtube-slider-form');
  if (youtubeSliderForm) {
    youtubeSliderForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/admin/youtube-slider', {
          method: 'POST',
          body: JSON.stringify({
            title: String(fd.get('title') || '').trim(),
            youtube_url: String(fd.get('youtube_url') || '').trim(),
            sort_order: Number(fd.get('sort_order') || 0)
          })
        });
        e.target.reset();
        await loadYoutubeSliderAdmin();
      } catch (err) {
        alert('Failed to add video: ' + err.message);
      }
    });
  }

  // Load and display testimonials for approval
  async function loadTestimonialsAdmin() {
    try {
      const items = await api('/api/admin/testimonies');
      const container = document.getElementById('testimonials-admin');
      
      if (!items.length) {
        container.innerHTML = '<p>No testimonials.</p>';
        return;
      }

      container.innerHTML = items.map(t => `
        <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0;">
          <strong>${escapeHtml(t.name || 'Anonymous')}</strong> (${escapeHtml(t.email || '')}) - ${new Date(t.created_at).toLocaleDateString()}
          ${t.testimony ? `<p style="margin-top: 8px; white-space: pre-wrap;"><strong>Text:</strong><br>${escapeHtml(t.testimony)}</p><small style="color: #666;">Status: ${t.testimony_approved ? '✅ Approved' : '❌ Pending'}</small>` : ''}
          ${t.video_url ? `<p style="margin-top: 8px;"><strong>Video URL:</strong> <a href="${escapeHtml(t.video_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(t.video_url)}</a><br><small style="color: #666;">Status: ${t.video_approved ? '✅ Approved' : '❌ Pending'}</small></p>` : ''}
          <div style="margin-top: 8px;">
            ${t.testimony ? `
              ${t.testimony_approved === 0 ? `<button data-id="${t.id}" data-field="testimony" class="approve-testimony-btn" style="background-color: #4CAF50; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Approve Text</button>` : `<button data-id="${t.id}" data-field="testimony" class="unapprove-testimony-btn" style="background-color: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Remove Approval (Text)</button>`}
            ` : ''}
            ${t.video_url ? `
              ${t.video_approved === 0 ? `<button data-id="${t.id}" data-field="video" class="approve-video-btn" style="background-color: #4CAF50; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Approve Video</button>` : `<button data-id="${t.id}" data-field="video" class="unapprove-video-btn" style="background-color: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-right: 5px;">Remove Approval (Video)</button>`}
            ` : ''}
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.approve-testimony-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ testimony_approved: 1 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to approve: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.unapprove-testimony-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          if (!confirm('Remove approval for this text testimony?')) return;
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ testimony_approved: 0 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to remove approval: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.approve-video-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ video_approved: 1 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to approve video: ' + err.message);
          }
        });
      });

      document.querySelectorAll('.unapprove-video-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const userId = btn.getAttribute('data-id');
          if (!confirm('Remove approval for this video testimony?')) return;
          try {
            await api(`/api/admin/testimonies/${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({ video_approved: 0 })
            });
            loadTestimonialsAdmin();
          } catch (err) {
            alert('Failed to remove approval: ' + err.message);
          }
        });
      });
    } catch (err) {
      console.error('Error loading testimonials:', err);
      document.getElementById('testimonials-admin').innerHTML = '<p>Error loading testimonials.</p>';
    }
  }

  // Load all approval panels
  loadCourseFeedbackAdmin();
  loadEventFeedbackAdmin();
  loadWorkshopFeedbackAdmin();
  loadYoutubeSliderAdmin();
  loadTestimonialsAdmin();
})();
</script>
</body></html>
