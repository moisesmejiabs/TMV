<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Tu Mejor Versión</title>
  <link rel="stylesheet" href="/static/css/style.css?v=single-event-surface-20260725" />
</head>
<body>
    <header class="top">
    <div class="brand" style="text-align: center;">

      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img flipped">
      
      <h1 class="nav-gold">
        <span 
          data-en="Tu<br>Mejor<br>Version" 
          data-es="Tu<br>Mejor<br>Versión">
        </span>
      </h1> 
      <img src="/static/images/TuMejorVersionBird.png"
          alt="Logo"
          class="brand-img">

      <!-- Right side: Auth controls -->
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>

    </div>

    <div style="margin-bottom: 20px;">
      <!-- 🌐 Language toggle buttons -->
      <span class="lang-toggle">
        <button type="button" class="lang-btn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" onclick="setLanguage('es')">🇲🇽 ES</button>
      </span>
    </div>
    
    <div class="nav-container">
      <!-- Hamburger Button -->
      <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Overlay Menu -->
      <nav id="mobile-menu" class="mobile-menu">

        <a href="/" class="nav-btn">
          <span data-en="Home" data-es="Inicio"></span>
        </a>

        <a href="/courses" class="nav-btn">
          <span data-en="Courses" data-es="Cursos"></span>
        </a>

        <a href="/events" class="nav-btn">
          <span data-en="Events" data-es="Eventos"></span>
        </a>

        <a href="/donate" class="nav-btn">
          <span data-en="Donate" data-es="Donar"></span>
        </a>        <a href="/forum" class="nav-btn">
          <span data-en="Forum" data-es="Foro"></span>
        </a>

        <a href="/about" class="nav-btn">
          <span data-en="About Us" data-es="Sobre Nosotros"></span>
        </a>

        <div id="auth-links" class="auth-links"></div>

      </nav>
    </div>
    </header>

  <div id="me" class="section-card">
  <h3>Current User</h3>
  <p><b>Name:</b> <span id="me-name"></span></p>
  <p><b>Email:</b> <span id="me-email"></span></p>
  </div>

    <main class="container detail-page">
      <article class="section-card course-detail-card">
        <div id="course-image-frame" class="course-detail-media" style="display:none;">
          <img id="course-image" alt="">
        </div>
        <h1 id="title" class="nav-gold">Course</h1>
        <dl class="course-detail-grid">
          <div><dt>Date:</dt><dd id="course-date"></dd></div>
          <div><dt>Presenter:</dt><dd id="presenter"></dd></div>
          <div><dt>Description:</dt><dd id="about"></dd></div>
          <div><dt>Location:</dt><dd id="loc"></dd></div>
          <div><dt>Requirements:</dt><dd id="req"></dd></div>
          <div><dt>Capacity:</dt><dd id="cap"></dd></div>
          <div><dt>Registered:</dt><dd id="count"></dd></div>
        </dl>
        <div id="actions"></div>
        <div id="admin"></div>
        <p><a href="/courses.html">Back</a></p>
        <div>
          <a href="#" onclick="shareCourseOnFacebook(event)" class="fb-share-btn">
            Compartir curso en Facebook
          </a>
        </div>
      </article>

      <section class="section-card feedback-section">
      <h2>Leave Feedback</h2>

      <form id="course-feedback-form" class="feedback-form">
        <label for="course-feedback-text">Your feedback</label>

        <textarea
          id="course-feedback-text"
          name="feedback"
          rows="5"
          maxlength="1000"
          placeholder="Write your feedback here..."
          required
        ></textarea>

        <div class="feedback-actions">
          <button type="submit" class="btn">Submit Feedback</button>
          <span id="course-feedback-status" class="muted"></span>
        </div>
      </form>

      <div class="feedback-list-wrap">
        <h3>Comments</h3>
        <ul id="course-feedback-list" class="feedback-list">
          <li class="muted">No feedback yet.</li>
        </ul>
      </div>
      </section>
    </main>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/facebook.js"></script>
  <script>
    function q(name){return new URLSearchParams(location.search).get(name)}
    function imageSrc(value){
      if(!value) return '';
      if(/^https?:\/\//i.test(value) || value.startsWith('/')) return value;
      return `/static/images/${value}`;
    }
    async function api(path, opts={}){
      const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
      const ct=r.headers.get('content-type')||'';
      const b=ct.includes('application/json')?await r.json().catch(()=>null):await r.text().catch(()=>null);
      if(!r.ok) throw new Error((b&&b.error)||'Request failed');
      return b;
    }
    (async()=>{
      const id=q('id');
      const c=await api(`/api/courses/${id}`);
      document.title = c.name;
      document.getElementById('title').textContent=c.name;
      document.getElementById('course-date').textContent =
        new Date(c.date).toLocaleString('en-US', {timeZone: 'America/New_York'});
      document.getElementById('presenter').textContent = c.presenter || 'Not specified';
      document.getElementById('about').textContent = c.about;
      document.getElementById('loc').textContent = c.location;
      document.getElementById('req').textContent = c.requirements || 'None';
      document.getElementById('cap').textContent = c.capacity || 0;
      document.getElementById('count').textContent = c.enrolled_count;

      const img = document.getElementById('course-image');

      if (img && c.image_url) {
        img.src = imageSrc(c.image_url);
        img.alt = c.name || 'Course image';
        document.getElementById('course-image-frame').style.display = 'block';
      }

      const me = await api('/api/me').catch(()=>null);
      let html='';
      if(!me){ html = '<p><a href="/login.html">Login</a> to register.</p>'; }
      else {
        html += c.enrolled ? '<button id="cancel">Cancel Enrollment</button>' : '<button id="enroll">Enroll</button>';
        if(me.role==='admin') html += ` <a class="btn" href="/create-course.html?id=${encodeURIComponent(id)}">Edit Course</a> <button id="delete">Delete Course</button>`;
      }
      document.getElementById('actions').innerHTML = html;

      const enrollBtn=document.getElementById('enroll');
      if(enrollBtn) enrollBtn.addEventListener('click', async()=>{await api(`/api/courses/${id}/enroll`,{method:'POST'}); location.reload();});
      const cancelBtn=document.getElementById('cancel');
      if(cancelBtn) cancelBtn.addEventListener('click', async()=>{await api(`/api/courses/${id}/cancel`,{method:'POST'}); location.reload();});
      const delBtn=document.getElementById('delete');
      if(delBtn) delBtn.addEventListener('click', async()=>{if(confirm('Delete this course? Feedback will be saved for future display.')){await api(`/api/courses/${id}`,{method:'DELETE'}); location.href='/courses.html';}});

      if(me && me.role==='admin'){
        const users = await api(`/api/courses/${id}/registered`);
        document.getElementById('admin').innerHTML = '<h3>Registered Users</h3>' + (users.length?('<ul>'+users.map(u=>`<li>${u.name} (${u.email})</li>`).join('')+'</ul>'):'<p>No enrollments.</p>');
      }
    })().catch(err=>{document.getElementById('about').textContent=err.message;});
  </script>
</body>
</html>
