<script>
  async function api(path, opts = {}) {
    console.log("🌐 API CALL →", path);
    console.log("📤 Options →", opts);

    let r;
    try {
      r = await fetch(path, {
        credentials: 'include',
        headers: {
          ...(opts.body ? { 'content-type': 'application/json' } : {})
        },
        ...opts
      });
    } catch (err) {
      console.error("❌ FETCH FAILED:", err);
      throw err;
    }

    console.log("📡 Response status:", r.status);

    let j;
    try {
      j = await r.json();
      console.log("📦 Response JSON:", j);
    } catch (err) {
      console.warn("⚠️ Failed to parse JSON");
      j = null;
    }

    if (!r.ok) {
      console.error("❌ API ERROR:", j);
      throw new Error(j?.error || 'Failed');
    }

    console.log("✅ API SUCCESS");
    return j;
  }

    async function loadPendingAgreements() {
      const container = document.getElementById('pending-agreements');
      if (!container) return;
      try {
        const docs = await api('/api/agreement-docs');
        const pending = docs.filter((doc) => !doc.acknowledged);
        const accepted = docs.filter((doc) => doc.acknowledged);

        if (!docs.length) {
          container.innerHTML = '<p>No agreement documents are currently active.</p>';
          return;
        }

        container.innerHTML = `
          <div style="margin-bottom: 18px;">
            <strong>Accepted documents</strong>
            ${accepted.length ? `<ul>${accepted.map((doc) => `
              <li>${escapeHtml(doc.title)} by ${escapeHtml(doc.author)} <a href="${doc.download_url}" target="_blank">Download</a></li>
            `).join('')}</ul>` : '<p>No documents accepted yet.</p>'}
          </div>
          <div>
            <strong>Pending documents</strong>
            ${pending.length ? `<ul>${pending.map((doc) => `
              <li style="margin-bottom: 10px;">
                ${escapeHtml(doc.title)} by ${escapeHtml(doc.author)}
                <a href="${doc.download_url}" target="_blank">Download</a>
                <button type="button" data-doc-id="${doc.id}" class="acknowledge-doc">Acknowledge</button>
              </li>
            `).join('')}</ul>` : '<p>No pending documents.</p>'}
          </div>
        `;

        document.querySelectorAll('.acknowledge-doc').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const docId = btn.getAttribute('data-doc-id');
            try {
              await api(`/api/agreement-docs/${docId}/acknowledge`, { method: 'POST' });
              await loadPendingAgreements();
            } catch (err) {
              alert(`Unable to acknowledge document: ${err.message}`);
            }
          });
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('pending') === '1') {
          const notice = document.createElement('div');
          notice.style.marginBottom = '16px';
          notice.style.padding = '12px';
          notice.style.border = '1px solid #d9534f';
          notice.style.background = '#f9e6e6';
          notice.style.color = '#d9534f';
          notice.textContent = 'You have pending documents that must be acknowledged before you can continue using the site.';
          container.prepend(notice);
        }
      } catch (err) {
        container.innerHTML = `<p>Error loading documents: ${escapeHtml(err.message)}</p>`;
      }
    }

    await loadPendingAgreements();

    const myEvents = await api('/api/user/events');
    const myEventsContainer = document.getElementById('my-events');
    myEventsContainer.innerHTML = myEvents.length ? `<ul>${myEvents.map((event) => `

  } catch (err) {

  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
