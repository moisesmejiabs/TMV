<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Mejor Versión — User Profile</title>
  <link rel="stylesheet" href="/static/css/style.css?v=event-full-width-20260725">
</head>
<body data-page-type="user">
  <header class="top">
    <div class="brand" style="text-align: center;">
      <img src="/static/images/TuMejorVersionBird.png" alt="" class="brand-img flipped">
      <h1 class="nav-gold">
        <span data-en="Tu<br>Mejor<br>Version" data-es="Tu<br>Mejor<br>Versión"></span>
      </h1>
      <img src="/static/images/TuMejorVersionBird.png" alt="" class="brand-img flipped">
      <div id="nav-auth" style="display:flex; gap:12px; align-items:center;"></div>
    </div>

    <div style="margin-bottom: 20px;">
      <span class="lang-toggle">
        <button type="button" class="lang-btn" onclick="setLanguage('en')">🇺🇸 EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" onclick="setLanguage('es')">🇲🇽 ES</button>
      </span>
    </div>

    <div class="nav-container">
      <button id="menu-toggle" class="menu-toggle"
              data-aria-label-en="Open menu" data-aria-label-es="Abrir menú"
              aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="mobile-menu" class="mobile-menu">
        <a href="/" class="nav-btn"><span data-en="Home" data-es="Inicio"></span></a>
        <a href="/courses" class="nav-btn"><span data-en="Courses" data-es="Cursos"></span></a>
        <a href="/events" class="nav-btn"><span data-en="Events" data-es="Eventos"></span></a>
        <a href="/donate" class="nav-btn"><span data-en="Donate" data-es="Donar"></span></a>
        <a href="/forum" class="nav-btn"><span data-en="Forum" data-es="Foro"></span></a>
        <a href="/about" class="nav-btn"><span data-en="About Us" data-es="Sobre Nosotros"></span></a>
        <a href="/testimonials" class="nav-btn"><span data-en="Testimonials" data-es="Testimonios"></span></a>
        <div id="auth-links" class="auth-links"></div>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="nav-gold">
      <span data-en="User Profile" data-es="Perfil de usuario"></span>
    </h1>

    <div id="me" class="section-card">
      <h3 data-en="Current User" data-es="Usuario actual"></h3>
      <p>
        <b data-en="Name:" data-es="Nombre:"></b>
        <span id="me-name"></span>
      </p>
      <p>
        <b data-en="Email:" data-es="Correo electrónico:"></b>
        <span id="me-email"></span>
      </p>
    </div>

    <p><a href="/" data-en="Administration" data-es="Administración"></a></p>

    <section class="section-card">
      <h2 data-en="Profile Information" data-es="Información del perfil"></h2>

      <form id="admin-user-form">
        <div>
          <label for="username" data-en="Username" data-es="Nombre de usuario"></label><br>
          <input type="text" id="username" name="username"
                 data-placeholder-en="Enter username"
                 data-placeholder-es="Escriba el nombre de usuario">
        </div>

        <br>

        <div>
          <label for="first_name" data-en="First Name" data-es="Nombre"></label><br>
          <input type="text" id="first_name" name="first_name"
                 data-placeholder-en="Enter first name"
                 data-placeholder-es="Escriba el nombre">
        </div>

        <br>

        <div>
          <label for="last_name" data-en="Last Name" data-es="Apellido"></label><br>
          <input type="text" id="last_name" name="last_name"
                 data-placeholder-en="Enter last name"
                 data-placeholder-es="Escriba el apellido">
        </div>

        <br>

        <div>
          <label for="email" data-en="Email" data-es="Correo electrónico"></label><br>
          <input type="email" id="email" name="email"
                 data-placeholder-en="Enter email address"
                 data-placeholder-es="Escriba el correo electrónico">
        </div>

        <br>

        <div>
          <label for="password" data-en="New Password" data-es="Nueva contraseña"></label><br>
          <input type="password" id="password" name="password"
                 data-placeholder-en="Leave blank if you do not want to change it"
                 data-placeholder-es="Déjela en blanco si no desea cambiarla">
        </div>

        <br>

        <div>
          <span data-en="Upload Photo" data-es="Subir foto"></span><br>
          <input type="file" id="photo" name="photo" accept="image/*" hidden>
          <label for="photo" role="button" class="nav-btn"
                 data-en="Choose photo" data-es="Elegir foto"></label>
          <span id="photo-name"
                data-empty-en="No photo selected"
                data-empty-es="Ninguna foto seleccionada"></span>
        </div>

        <br>

        <div>
          <label for="video_url"
                 data-en="Testimonial Video URL"
                 data-es="URL del video testimonial"></label><br>
          <input type="url" id="video_url" name="video_url"
                 data-placeholder-en="Paste the YouTube video URL"
                 data-placeholder-es="Pegue la URL del video de YouTube">
          <p style="font-size: 0.9rem; color: #555;"
             data-en="Enter a YouTube video link for administrator approval."
             data-es="Ingrese un enlace de video de YouTube para la aprobación del administrador."></p>
        </div>

        <br>

        <div>
          <label for="testimony" data-en="Testimonial" data-es="Testimonio"></label><br>
          <textarea id="testimony" name="testimony" rows="8"
                    data-placeholder-en="Write your testimonial here..."
                    data-placeholder-es="Escriba su testimonio aquí..."></textarea>
        </div>

        <br>

        <button type="submit" data-en="Save Changes" data-es="Guardar cambios"></button>
        <p id="profile-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="section-card">
      <h2 data-en="Agreement Documents" data-es="Documentos de acuerdos"></h2>
      <div id="pending-agreements" aria-live="polite"></div>
    </section>

    <section class="section-card">
      <h2 data-en="My Events" data-es="Mis eventos"></h2>
      <p data-en="Only events associated with your signed-in account are shown."
         data-es="Solo se muestran los eventos asociados con su cuenta."></p>
      <div id="my-events" aria-live="polite"></div>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/adminuser.js"></script>
</body>
</html>
