  <body>
    <main class="container" style="padding-top:18px;max-width:760px;">
    <h1 class="nav-gold">Create Thread</h1>
      <form id="f">
        <label>Title<br><input name="title" required style="width:100%"></label><br><br>
        <label>Body<br><textarea name="body" required rows="8" style="width:100%"></textarea></label><br><br>
        <button type="submit">Post</button>
      </form>
      <p id="msg"></p>
      <p><a href="/forum.html">Back</a></p>
    </main>
      <script src="/static/js/app.js"></script>
  <script>
  async function api(path, opts={}){
    const r=await fetch(path,{credentials:'include', headers:{...(opts.body?{'content-type':'application/json'}:{})}, ...opts});
    const j=await r.json().catch(()=>null);
    if(!r.ok) throw new Error(j?.error || 'Failed');
    return j;
  }
  document.getElementById('f').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    try{
      const out = await api('/api/forum/threads', {method:'POST', body: JSON.stringify({title: fd.get('title'), body: fd.get('body')})});
      location.href = `/thread.html?id=${out.id}`;
    }catch(err){document.getElementById('msg').textContent=err.message;}
  });
  </script>
