  <style>
    .index-tmv-header {
      min-height: 180px;
      margin: -2rem -2rem 0;
      padding: 28px clamp(20px, 4vw, 56px);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, #cf0b88 0%, #b30773 34%, #861447 72%, #5b142f 100%);
      border-bottom: 1px solid rgba(246, 234, 223, 0.34);
      box-shadow: 0 14px 36px rgba(73, 15, 42, 0.22);
    }

    .index-tmv-brand {
      gap: clamp(18px, 3vw, 38px);
      color: inherit;
      text-decoration: none;
    }

    .index-tmv-brand .brand-img {
      width: auto;
      height: clamp(82px, 9vw, 126px);
      border-radius: 0;
      -webkit-mask-image: radial-gradient(ellipse 76% 72% at center, #000 55%, transparent 100%);
      mask-image: radial-gradient(ellipse 76% 72% at center, #000 55%, transparent 100%);
      filter:
        saturate(0.92)
        drop-shadow(0 10px 16px rgba(62, 5, 35, 0.28))
        drop-shadow(0 0 12px rgba(255, 239, 205, 0.2));
    }

    .index-tmv-brand h1.nav-gold {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.35rem);
      line-height: 0.92;
      letter-spacing: 0.1em;
      text-align: center;
      text-shadow: 0 8px 20px rgba(21, 5, 13, 0.34);
    }

    @media (max-width: 900px) {
      .index-tmv-header {
        margin: -1.25rem -1.25rem 0;
      }
    }

    @media (max-width: 600px) {
      .index-tmv-header {
        min-height: 150px;
        margin: -0.9rem -0.9rem 0;
        padding: 22px 14px;
      }

      .index-tmv-brand {
        gap: 12px;
      }

      .index-tmv-brand .brand-img {
        height: clamp(62px, 18vw, 82px);
      }

      .index-tmv-brand h1.nav-gold {
        font-size: clamp(1.55rem, 6vw, 2rem);
      }
    }
  </style>

  <script>
  /*****************************************************************************
   * BEGIN Page INIT
   ***************************************************************************/
  console.log("🚀 INIT EXECUTION BLOCK START");
  console.log("📄 document.readyState =", document.readyState);

  if (document.readyState === "loading") {
    console.log("⏳ DOM still loading → attaching DOMContentLoaded listeners");

    document.addEventListener("DOMContentLoaded", () => {
      console.log("🔥 DOMContentLoaded fired");

      if (typeof loadCourses === "function") {
        console.log("📚 Calling loadCourses()");
        loadCourses();
      } else {
        console.warn("⚠️ loadCourses is not defined");
      }

      if (typeof loadEvents === "function") {
        console.log("📅 Calling loadEvents()");
        loadEvents();
      } else {
        console.warn("⚠️ loadEvents is not defined");
      }
    });

  } else {
    console.log("⚡ DOM already loaded → executing immediately");

    if (typeof loadCourses === "function") {
      console.log("📚 Calling loadCourses()");
      loadCourses();
    } else {
      console.warn("⚠️ loadCourses is not defined");
    }

    if (typeof loadEvents === "function") {
      console.log("📅 Calling loadEvents()");
      loadEvents();
    } else {
      console.warn("⚠️ loadEvents is not defined");
    }
  }

  console.log("✅ INIT EXECUTION BLOCK END");
  </script>

  <script>


  /* prepares the image slider */
  document.addEventListener("DOMContentLoaded", function () {
    const slides = document.querySelector(".slides");
    const images = document.querySelectorAll(".slides img");
    const prev = document.querySelector(".prev");
    const next = document.querySelector(".next");

    let index = 0;
    const total = images.length;

    console.log("Slider initialized");
    console.log("Total images:", total);

    console.log("slides element:", slides);
    console.log("number of images:", images.length);

    images.forEach((img, i) => {
      console.log("----");
      console.log("Index:", i);
      console.log("src:", img.src);
      console.log("complete:", img.complete);
      console.log("naturalWidth:", img.naturalWidth);
      console.log("naturalHeight:", img.naturalHeight);
    });

    function updateSlider() {
      console.log("Updating slider. Current index:", index);
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    next.addEventListener("click", function () {
      console.log("NEXT clicked. Current index before:", index);

      if (index < total - 1) {
        index++;
        console.log("Index incremented to:", index);
        updateSlider();
      } else {
        console.log("Already at last slide.");
      }
    });

    prev.addEventListener("click", function () {
      console.log("PREV clicked. Current index before:", index);

      if (index > 0) {
        index--;
        console.log("Index decremented to:", index);
        updateSlider();
      } else {
        console.log("Already at first slide.");
      }
    });
  });  

  </script>
