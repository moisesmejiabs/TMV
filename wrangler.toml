name = "tu-mejor-version"
main = "src/worker.ts"
compatibility_date = "2026-02-24"
routes = [
  { pattern = "tumejorversion-li.org/*", zone_name = "tumejorversion-li.org" },
  { pattern = "www.tumejorversion-li.org/*", zone_name = "tumejorversion-li.org" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tumejorversion"
database_id = "31323ca1-ff6e-4f95-8119-5e5b85dc9c27"

[[r2_buckets]]
binding = "R2"
bucket_name = "tumejorversion-assets"

# JWT_SECRET must be stored as a Cloudflare Worker secret, not in this file.
# Configure it with: npx wrangler secret put JWT_SECRET
